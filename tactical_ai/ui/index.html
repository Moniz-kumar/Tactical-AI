<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tactical AI</title><link rel="stylesheet" href="/static/styles.css"></head><body><main class="shell"><header><div id="score">0 – 0</div><div id="clock">00:00</div><div><button id="play">Play</button><button id="new">New match</button></div></header><section class="grid"><section class="main"><svg id="pitch" viewBox="0 0 1000 620"><rect class="grass" x="10" y="10" width="980" height="600"/><rect class="line" x="30" y="30" width="940" height="560"/><line class="line" x1="500" y1="30" x2="500" y2="590"/><circle class="line" cx="500" cy="310" r="75"/><rect class="line" x="30" y="155" width="145" height="310"/><rect class="line" x="825" y="155" width="145" height="310"/><g id="left"></g><g id="right"></g><g id="ball"></g></svg><div class="timeline"><span>0'</span><input id="timeline" type="range" min="0" max="0" value="0"><span>90'</span></div><div class="controls"><label>Formation<select id="formation"><option>4-3-3</option><option>4-2-3-1</option><option>3-5-2</option></select></label><label>Pressing<select id="pressing"><option>low</option><option>medium</option><option>high</option></select></label><label>Defensive line<select id="line"><option>low</option><option>mid</option><option>high</option></select></label><label>Tempo<select id="tempo"><option>slow</option><option>balanced</option><option>fast</option></select></label><button id="apply">Apply tactics</button><button id="sub">Make substitution</button></div></section><aside><div class="card"><h3>Opponent Style</h3><div>High press <progress id="high" max="1"></progress><b id="highv"></b></div><div>Possession <progress id="poss" max="1"></progress><b id="possv"></b></div><div>Counter <progress id="counter" max="1"></progress><b id="counterv"></b></div></div><div class="card"><h3>Agent decisions</h3><div id="decisions"></div></div><div class="card"><h3>Match stats</h3><table><tr><th></th><th>You</th><th>Opp</th></tr><tr><td>Possession</td><td id="pf"></td><td id="pa"></td></tr><tr><td>Shots</td><td id="sf"></td><td id="sa"></td></tr><tr><td>xG</td><td id="xf"></td><td id="xa"></td></tr><tr><td>Fouls</td><td id="ff"></td><td id="fa"></td></tr></table></div></aside></section></main><script src="/static/app.js"></script></body></html>
